services:
  inventario:
    build: ./app
    container_name: trab02_2026_2_12621cbs212
    ports:
      - "2212:8000"
    volumes:
      - inventario_dados:/app/data   # os JSON sobrevivem a reinícios e recriações do container
    restart: unless-stopped          # sobe de novo após queda ou reboot do servidor

volumes:
  inventario_dados:
